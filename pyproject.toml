[project]
name = "flightlog"
version = "2.0.0"
description = "Personal flight archive — local FastAPI + SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
