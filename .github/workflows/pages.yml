# site/ 说明页：私有仓未启用 GitHub Pages，勿自动 push 部署。
# 需要时手动 workflow_dispatch；生产产品站见 docs/DEPLOY.md / tencent-deploy.yml。
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 静态页
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
