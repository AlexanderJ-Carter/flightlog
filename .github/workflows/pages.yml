# site/ 仅作仓库静态说明页；生产站走 Tunnel（flightlog.alexander.xin），见 docs/DEPLOY.md。
# 仓库未启用 GitHub Pages，此工作流仅保留为可选手动开关，避免历史 push 部署 404 刷红。
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skip:
    runs-on: ubuntu-latest
    steps:
      - name: Pages 未启用
        run: |
          echo "GitHub Pages 未用于本仓部署；生产见 docs/DEPLOY.md / tencent-deploy.yml。"
          echo "如需启用，先在 Settings → Pages 打开，再恢复 deploy-pages 步骤。"
